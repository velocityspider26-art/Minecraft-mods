name: CrashTest CI

on:
  push:
    branches:
      - crashtest-ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct source
        run: cat parts/part-* | base64 -d > source.zip

      - name: Test source archive
        run: unzip -t source.zip

      - name: Unpack source
        run: mkdir -p work && unzip -q source.zip -d work

      - name: Wire Sable dependency
        shell: bash
        run: |
          sed -i '/repositories {/a\    maven { url = uri("https://www.cursemaven.com") }' work/crashtest/build.gradle
          sed -i '/dependencies {/a\    implementation "curse.maven:sable-1312371:8673825"' work/crashtest/build.gradle

      - name: Build
        working-directory: work/crashtest
        run: gradle build --stacktrace

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crashtest-build
          path: work/crashtest/build/libs/*.jar
          if-no-files-found: warn
