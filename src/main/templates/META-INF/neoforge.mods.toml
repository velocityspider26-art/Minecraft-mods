side="BOTH"

[[dependencies.${mod_id}]]
modId="zps"
type="required"
versionRange="[1.21.1-2.4.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="[2.0.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aeronautics"
type="required"
versionRange="[${create_aeronautics_mod_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="lodestone"
type="required"
versionRange="[1.8.2,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="distanthorizons"
type="required"
versionRange="[3.2.0-b,)"
ordering="AFTER"
side="CLIENT"
