plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'create-jet-engines'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    // Blockbench project files are editable sources, shipped in the source zip but
    // not needed inside the production jar.
    exclude("**/*.bbmodel")
    exclude("**/.cache/**")
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    // Create / Flywheel / Ponder / Registrate
    maven { name = 'tterrag'; url = 'https://maven.tterrag.com/' }
    // Veil, Sable ecosystem mirrors
    maven { name = 'ModrinthMaven'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    // Local dependency jars pulled from the real distributed builds (see libs/README.md)
    flatDir { dirs 'libs' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ---------------------------------------------------------------------
    // Sable physics + sublevels. Compiled against the REAL distributed jars.
    // These are compileOnly: their classes are NEVER packaged into our jar.
    // ---------------------------------------------------------------------
    compileOnly files('libs/sable-neoforge-1.21.1-2.0.3.jar')
    compileOnly files('libs/sable-companion-common-1.21.1-1.6.0.jar')
    // Veil supplies foundry.veil.platform.registry.RegistryObject, which appears in
    // Sable's ForceGroups signatures, so it is needed on the compile classpath.
    compileOnly files('libs/veil-neoforge-1.21.1-4.1.4.jar')

    // The same real jars are put on the development runtime classpath so runClient/runServer
    // boot with actual Sable present. localRuntime (not runtimeOnly) keeps them out of the
    // published metadata, and none of them are packaged into our jar.
    localRuntime files('libs/sable-neoforge-1.21.1-2.0.3.jar')
    localRuntime files('libs/sable-companion-common-1.21.1-1.6.0.jar')
    localRuntime files('libs/veil-neoforge-1.21.1-4.1.4.jar')
    localRuntime files('libs/sable-rapier-1.21.1-2.0.3.jar')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            sable_version          : sable_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
