name: CrashTest CI

on:
  push:
    branches:
      - crashtest-ci

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct source
        run: cat parts/part-* | base64 -d > source.zip

      - name: Test source archive
        run: unzip -t source.zip

      - name: Unpack source
        run: mkdir -p work && unzip -q source.zip -d work

      - name: Wire official Sable compile dependencies
        shell: bash
        run: |
          sed -i '/repositories {/a\    maven { url = uri("https://maven.ryanhcode.dev/releases") }' work/crashtest/build.gradle
          sed -i '/dependencies {/a\    implementation("dev.ryanhcode.sable:sable-common-1.21.1:2.0.5") { transitive = false }\n    implementation("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0") { transitive = false }' work/crashtest/build.gradle

      - name: Use Sable common event API
        shell: bash
        run: |
          sed -i '/import dev.crashtest.crash.CrashImpactManager;/a\import dev.ryanhcode.sable.platform.SableEventPlatform;' work/crashtest/src/main/java/dev/crashtest/CrashTestMod.java
          sed -i 's/NeoForge.EVENT_BUS.addListener(CrashImpactManager::onPostPhysicsTick);/SableEventPlatform.INSTANCE.onPostPhysicsTick(CrashImpactManager::onPostPhysicsTick);/' work/crashtest/src/main/java/dev/crashtest/CrashTestMod.java
          sed -i '/import dev.ryanhcode.sable.neoforge.event.ForgeSablePostPhysicsTickEvent;/d' work/crashtest/src/main/java/dev/crashtest/crash/CrashImpactManager.java
          sed -i 's/public static void onPostPhysicsTick(final ForgeSablePostPhysicsTickEvent event) {/public static void onPostPhysicsTick(final SubLevelPhysicsSystem system, final double timeStep) {/' work/crashtest/src/main/java/dev/crashtest/crash/CrashImpactManager.java
          sed -i '/final SubLevelPhysicsSystem system = event.getPhysicsSystem();/d' work/crashtest/src/main/java/dev/crashtest/crash/CrashImpactManager.java

      - name: Build
        working-directory: work/crashtest
        run: gradle build --no-configuration-cache --stacktrace

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crashtest-build
          path: work/crashtest/build/libs/*.jar
          if-no-files-found: warn
