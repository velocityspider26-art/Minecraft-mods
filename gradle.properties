# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled: ModDevGradle's run tasks are not fully
# configuration-cache compatible in 2.0.x.
org.gradle.configuration-cache=false

# Parchment mappings (human-readable parameter names over official Mojang mappings)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Target NeoForge version. Sable 2.0.3 requires [21.1.228,).
