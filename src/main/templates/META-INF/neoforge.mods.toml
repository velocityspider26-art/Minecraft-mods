modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Create Aerial Warfare adds modular aircraft propulsion and aerial-warfare systems.
CAW Core v0.3 uses Sable physics-tick propulsion actors and a client-side mesh exhaust renderer rather than particle exhaust.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="[2.0.3,3.0.0)"
ordering="AFTER"
side="BOTH"
