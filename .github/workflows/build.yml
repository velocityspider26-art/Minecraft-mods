name: CrashTest CI

on:
  push:
    branches: [crashtest-ci]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct and unpack source
        run: |
          cat parts/part-* | base64 -d > source.zip
          unzip -t source.zip
          mkdir -p work
          unzip -q source.zip -d work

      - name: Wire Sable 2.0.5 dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('work/crashtest/build.gradle')
          s = p.read_text()
          old = '''repositories {
    // Add the Maven repository that hosts your exact Sable 2.0.5 artifact here, if you use Maven.
    // The PoC deliberately does not guess a repository URL or artifact coordinate.
}'''
          new = '''repositories {
    maven { url = uri("https://www.cursemaven.com") }
}'''
          s = s.replace(old, new)
          s = s.replace('dependencies {\n', 'dependencies {\n    implementation "curse.maven:sable-1312371:8673825"\n', 1)
          p.write_text(s)
          PY

      - name: Build
        working-directory: work/crashtest
        run: gradle build --stacktrace

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crashtest-build
          path: work/crashtest/build/libs/*.jar
          if-no-files-found: warn
