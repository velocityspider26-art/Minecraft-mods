modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Create Aerial Warfare adds modular aircraft propulsion and aerial-warfare systems.
CAW Core v0.1 provides a redstone-throttled modular jet engine with optional inlet,
spool dynamics, runtime exhaust, and Sable rigid-body thrust integration when available.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
