plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
    maven {
        name = 'ryanhcode (Sable / Simulated / Create Aeronautics)'
        url = 'https://maven.ryanhcode.dev/releases'
    }
    maven {
        name = 'createmod.net (Create / Ponder / Flywheel)'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'BlameJared (Veil)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'devOS (Registrate)'
        url = 'https://mvn.devos.one/snapshots'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'bawnorton (MixinSquared)'
        url = 'https://maven.bawnorton.com/releases'
    }
}

dependencies {
    // --- Create Aeronautics platform (replaces Valkyrien Skies) ---
    // Sable is the physics/moving-world engine underlying Create Aeronautics.
    // Its POM pulls in sable-companion (compile), veil (compile) and
    // create/ponder/flywheel/registrate (runtime).
    implementation "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}"

    // Create Aeronautics itself (simulated = physics gameplay module, aeronautics = content module)
    localRuntime "dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_version}"
    localRuntime "dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${aeronautics_version}"

    // Create — compile against the slim jar for contraption/content integration
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    localRuntime "com.simibubi.create:create-${minecraft_version}:${create_version}"

    // Registrate (used by Genesis fluid registration; also a Create runtime dep)
    jarJar(implementation("com.tterrag.registrate:Registrate:${registrate_version}")) {
        version {
            strictly "[${registrate_version},)"
            prefer "${registrate_version}"
        }
    }

    // --- Other mod dependencies ---
    implementation "maven.modrinth:pehkui:${pehkui_version}"
    implementation "maven.modrinth:lodestonelib:${lodestone_version}"

    // MixinSquared for mixing into other mods' mixin handlers (Sable/Pehkui)
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"))
    jarJar(implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixinsquared_version}")) {
        version {
            strictly "[${mixinsquared_version},)"
            prefer "${mixinsquared_version}"
        }
    }

    // Earcut (polygon triangulation, used by the planet shadow renderer)
    jarJar(implementation("org.maplibre:earcut4j:${earcut_version}")) {
        version {
            strictly "[${earcut_version},)"
            prefer "${earcut_version}"
        }
    }

    // --- Test dependencies ---
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testImplementation "org.joml:joml:1.10.5"
    testImplementation "org.joml:joml-primitives:1.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
