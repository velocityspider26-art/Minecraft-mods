modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="velocityspider26-art"
description='''
Realistic, Teardown-style crash physics for Create: Aeronautics and other Sable physics vehicles.

Ships plow trenches and craters into the ground, punch through walls, crumple on impact, shed wings and tails
when the crash loads exceed what their joints can hold, throw dirt and wreckage, start fires, and hurt the crew
with g-forces. Damage is driven by real penetration mechanics (speed, mass, density and material strength).
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    versionRange="${sable_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aeronautics"
    type="optional"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"
