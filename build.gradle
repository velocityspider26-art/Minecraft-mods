plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = project.mod_version
group = project.maven_group

def runningInCodexSandbox = System.getProperty("user.name", "").contains("CodexSandbox") ||
        System.getProperty("user.home", "").replace('\\', '/').contains("CodexSandbox")
if (runningInCodexSandbox) {
    layout.buildDirectory.set(file("${System.getenv('TEMP') ?: 'C:/tmp'}/genesis-neoforge-build"))
}

base {
    archivesName = project.archives_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
    exclude("META-INF/mods.toml")
}

sourceSets.test.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath

repositories {
    flatDir { dir 'libs' }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Kotlin for Forge"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
    maven { url = "https://maven.blamejared.com/" }
    // Registrate for 1.21 is published here, not on tterrag's own maven (which
    // stops at MC1.20). Without it a clean checkout cannot resolve
    // com.tterrag.registrate:Registrate:MC1.21-1.3.0+67.
    maven { url = "https://mvn.devos.one/snapshots" }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven { url = "https://maven.bawnorton.com/releases" }
    maven { url = "https://maven.enjarai.dev/mirrors" }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            jvmArgument '-Xms2G'
            jvmArgument '-Xmx10G'
            jvmArgument '-XX:+UseZGC'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Opt-in: ./gradlew runClient -PquickWorld="TestWorld" boots straight into a save
            if (project.hasProperty('quickWorld')) {
                programArguments.addAll '--quickPlaySingleplayer', project.getProperty('quickWorld')
            }
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            jvmArgument '-Xms2G'
            jvmArgument '-Xmx10G'
            jvmArgument '-XX:+UseZGC'
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeOnly {
        setExtendsFrom(extendsFrom.findAll { it.name != 'runtimeOnly' })
    }
}

/**
 * Warns about loose jars in libs/ that will collide at runtime.
 *
 * <p>Two jars registering one mod id is not a Gradle error and not a FML crash
 * — the game just picks one and carries on, so a stale jar shows up much later
 * as a mod behaving like the wrong version. This turns that into a build
 * message naming the exact file to delete.</p>
 */
def checkLooseModJars(FileTree jars) {
    // Mod slugs declared as Modrinth dependencies below. A libs/ jar starting
    // with one of these is a second copy of something Gradle already resolves.
    def declared = ['pehkui', 'create', 'create-aeronautics', 'sable', 'curios', 'zps',
                    'lodestonelib', 'fusion-connected-textures', 'architectury-api',
                    'kotlin-for-forge', 'spark', 'jei', 'mekanism']
    def bySlug = [:].withDefault { [] }
    jars.each { jar ->
        // Strip the version: everything up to the first '-' followed by a digit.
        def slug = (jar.name.toLowerCase() - '.jar').replaceFirst(/-\d.*$/, '')
        bySlug[slug] << jar.name
    }
    bySlug.each { slug, names ->
        if (names.size() > 1) {
            logger.warn("[libs] '${slug}' has ${names.size()} jars in libs/ — ${names.join(', ')}. " +
                    "They register the same mod id; delete all but the 1.21.1 one.")
        }
        if (declared.contains(slug)) {
            logger.warn("[libs] '${slug}' is already a declared dependency, but libs/ also has " +
                    "${names.join(', ')}. Delete it — otherwise both load and classpath order " +
                    "decides which version the game uses.")
        }
    }
}

dependencies {
    // Distant Horizons is NOT a dependency of the planet renderer any more.
    // Genesis' own sparse voxel pyramid is the sole source of orbital terrain,
    // so DH is neither compiled against nor shipped. It is simply one of the
    // loose jars below, and the game runs with or without it.
    //
    // libs/ holds the development run's loose mod jars. They all go on the run
    // classpath — but a jar here that duplicates a mod declared further down,
    // or a second copy of a jar already in this folder, loads *alongside* it.
    // Both copies register the same mod id and classpath order decides which
    // one the game actually uses, which is how a 1.20.1 jar ends up quietly
    // shadowing the 1.21 build resolved from Modrinth. Neither case is an
    // error Gradle would otherwise report, so name them loudly here.
    checkLooseModJars(fileTree(dir: 'libs', include: '*.jar'))
    fileTree(dir: 'libs', include: '*.jar').each { localRuntime(files(it)) }
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation("io.github.llamalad7:mixinextras-neoforge:0.5.0")
    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.6-beta.1"))
    implementation("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.6-beta.1")

    compileOnly("com.fasterxml.jackson.core:jackson-annotations:2.17.2")

    // Zero Point Systems is a REQUIRED dependency, not a convenience: it is
    // declared type="required" in neoforge.mods.toml, and Genesis content is
    // built on it — the moon's lithium ore worldgen places
    // zps:deepslate_lithium_ore, and eight recipes use zps:aluminum_ingot,
    // zps:space_metal_mesh and zps:void_caution_block. Dropping the dependency
    // alone stops the game booting.
    //
    // It does cost 21.7s of render thread on every WORLD LOAD — its cable
    // blocks compute uncached voxel-shape unions and Blocks.rebuildCache walks
    // every blockstate. That is a real problem worth fixing with a shape cache,
    // but it is a world-load cost and has nothing to do with travelling to
    // space, which is what it was briefly and wrongly blamed for.
    implementation("maven.modrinth:zps:${zps_version}")
    implementation("maven.modrinth:lodestonelib:${lodestone_version}")
    implementation("maven.modrinth:pehkui:${pehkui_version}")
    implementation("maven.modrinth:curios:${curios_version}")

    implementation("maven.modrinth:fusion-connected-textures:${fusion_version}")
    implementation("maven.modrinth:architectury-api:${architectury_version}")
    implementation("maven.modrinth:kotlin-for-forge:${kotlin_for_forge_version}")
    localRuntime("maven.modrinth:create:${create_version}")
    implementation("maven.modrinth:sable:${sable_version}")
    implementation("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}")
    implementation("maven.modrinth:create-aeronautics:${create_aeronautics_version}")

    additionalRuntimeClasspath("org.maplibre:earcut4j:3.0.0")
    implementation("org.maplibre:earcut4j:3.0.0")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.2.0")
    implementation("org.joml:joml:1.10.4")
    implementation("org.joml:joml-primitives:1.10.0")
    // joml core is provided by Minecraft at runtime, but joml-primitives (AABBdc, etc.,
    // originally supplied by Valkyrien Skies) is not — add it to the dev run classpath,
    // mirroring the earcut4j handling above.
    additionalRuntimeClasspath("org.joml:joml-primitives:1.10.0")

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testImplementation("org.joml:joml:1.10.4")
    testImplementation("org.joml:joml-primitives:1.10.0")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.0")

    runtimeOnly("maven.modrinth:spark:${spark_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    compileOnly("maven.modrinth:mekanism-generators:${mekanism_generators_version}")
    compileOnly("maven.modrinth:mekanism:${mekanism_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            create_aeronautics_mod_version: create_aeronautics_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('copyBuiltJarToProject', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar', Jar).flatMap { it.archiveFile }
    into layout.projectDirectory.dir('dist')
}

tasks.named('build') {
    finalizedBy tasks.named('copyBuiltJarToProject')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
