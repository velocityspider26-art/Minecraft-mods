modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/velocityspider26-art/Minecraft-mods/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Sable supplies the sublevel physics that jet thrust is applied through.
# It is REQUIRED: without it there is nothing to propel.
[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "[${sable_version},)"
ordering = "AFTER"
side = "BOTH"

# Create Aeronautics provides the aircraft-building content this addon is designed
# around, but the propulsion itself talks directly to Sable, so it stays optional.
[[dependencies.${mod_id}]]
modId = "aeronautics"
type = "optional"
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[6.0.10,6.1.0)"
ordering = "AFTER"
side = "BOTH"
