neo_version_range=[21.1.238,)
loader_version_range=[4,)

## Mod Properties
mod_id=create_jet_engines
mod_name=Create: Jet Engines
mod_license=MIT
mod_version=1.0.4
mod_group_id=com.velocityspider.createjetengines
mod_authors=velocityspider26
mod_description=Modular jet engines for Create Aeronautics. Build a real turbofan from fan, compressor, combustion, afterburner and nozzle modules and physically propel Sable sublevels.

## Dependency versions (runtime environment this addon targets)
